<!doctype html>
<html>
  <head>
    <title>Page Title</title>
  </head>
  <body>
    <form action="url.com" method="get">
      <label for="name">Enter your full name</label>
      <br />
      <br />
      <input id="name" type="text" />
      <br />
      <br />
      <label for="email">Enter your email</label>
      <br />
      <br />
      <input id="email" type="email" />
      <br />
      <br />
      <label for="password">Enter your password</label>
      <br />
      <br />
      <input id="password" type="password" />
      <br />
      <br />
      <label for="confirm">Confirm your password</label>
      <br />
      <br />
      <input id="confirm" type="confirm" />

      <p>
        Enter your gender <br />
        <input type="radio" value="male" name="gender" />Male
        <input type="radio" value="female" name="gender" />Female
        <input type="radio" value="others" name="gender" /> Others
      </p>

      <label for="birth">Enter your Date of birth</label> <br />
      <input id="birth" type="date" name="birth" />

      <label for="Address">Enter your Address</label>
      <textarea id="Address" placeholder="address"></textarea>

      <button type="submit">submit</button>
    </form>
  </body>
</html>
